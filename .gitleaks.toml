regexes = ['''(?i)^\s*"(?:source_key|key)":\s*"(?:0x2791bca1f2de4661ed88a30c99a7a9449aa84174|0x2cacca1266653bb090d3fb511456ebca33150562|0x3c499c542cef5e3811e1192ce70d8cc03d5c3359|0x5f790ffa0695967a2d711872ecb4c7553e24794d|0x7b9e327748462f1038c9d081c98d189b22c60a27|0x7ceb23fd6bc0add59e62ac25578270cff1b9f619)",?\s*$''']
