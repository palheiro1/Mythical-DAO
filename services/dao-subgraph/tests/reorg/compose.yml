name: mythical-graph-reorg
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graph
      POSTGRES_PASSWORD: ${GRAPH_TEST_DB_PASSWORD:?ephemeral password required}
      POSTGRES_DB: graph
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
  ipfs:
    image: ipfs/kubo:v0.17.0
    ports: ["127.0.0.1:5001:5001"]
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
  graph-node:
    image: graphprotocol/graph-node:v0.45.0
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:8020:8020", "127.0.0.1:8030:8030"]
    depends_on:
      postgres: { condition: service_healthy }
      ipfs: { condition: service_started }
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      postgres_host: postgres
      postgres_user: graph
      postgres_pass: ${GRAPH_TEST_DB_PASSWORD:?ephemeral password required}
      postgres_db: graph
      ipfs: ipfs:5001
      ethereum: matic:http://host.docker.internal:9545
      GRAPH_LOG: warn
      ETHEREUM_POLLING_INTERVAL: "500"
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
